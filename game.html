function player(id){return players.find(x=>x.id===id)}function picked(){return S.pick.map(player)}function starters(){return S.five.map(player)}
function avg(a,k){return a.length?a.reduce((s,p)=>s+p[k],0)/a.length:0}function playerEnergy(id){return Math.max(0,Math.min(100,Math.round(S.energy[id]??100)))}function lineupEnergy(){return S.five.length?Math.round(S.five.reduce((n,id)=>n+playerEnergy(id),0)/S.five.length):0}function energyWidget(id){const value=playerEnergy(id),state=value>=85?'Fresh':value>=70?'Ready':value>=55?'Watch':'Low';return `<div class="energy-row"><span>ENERGY</span><div class="energy-track" role="meter" aria-label="${value}% energy"><i style="width:${value}%"></i></div><strong>${value}%</strong><span class="energy-state">${state}</span></div>`}function talent(p){return(p.s+p.pa+p.d+p.q+p.a)/5}
function fit(){const a=picked();if(!a.length)return 0;let roles=(a.some(p=>p.p.includes('G'))?12:0)+(a.some(p=>p.p.includes('W'))?10:0)+(a.some(p=>p.p.includes('B'))?13:0);return Math.min(99,Math.round(roles+(avg(a,'pa')+avg(a,'q')+avg(a,'d'))/3*.58))}
function depth(){const b=picked().filter(p=>!S.five.includes(p.id));return Math.round((avg(b,'d')*.45+avg(b,'q')*.3+avg(b,'a')*.25)||0)}
function rating(){const f=starters(),t=tactics.find(x=>x.id===S.tactic);const legs=S.five.reduce((n,id)=>n+(S.energy[id]||100),0)/Math.max(1,S.five.length);return Math.round(avg(f,'s')*.28+avg(f,'pa')*.2+avg(f,'d')*.24+avg(f,'q')*.17+avg(f,'a')*.11+fit()*.08+(t.off+t.def)*.3+(legs-100)*.2+(typeof physTeam==='function'?physTeam(f):0))}
function autoStarters(){const sort=[...picked()].sort((a,b)=>talent(b)-talent(a));if(sort.length<5)return;let f=sort.slice(0,5);if(!f.some(p=>p.p.includes('G'))){const g=sort.find(p=>p.p.includes('G'));if(g)f[4]=g}if(!f.some(p=>p.p.includes('B'))){const b=sort.find(p=>p.p.includes('B'));if(b)f[3]=b}S.five=[...new Set(f.map(p=>p.id))];while(S.five.length<5){const id=S.pick.find(x=>!S.five.includes(x));if(!id)break;S.five.push(id)}}
function autoDraft(){const sort=[...players].sort((a,b)=>talent(b)-talent(a));S.pick=sort.slice(0,8).map(p=>p.id);autoStarters();roster()}
function roster(){S.screen='roster';const ready=S.pick.length===8&&S.five.length===5&&S.five.some(id=>player(id).p.includes('G'))&&S.five.some(id=>player(id).p.includes('B'))&&S.team!==null;const status=S.pick.length<8?`Draft ${8-S.pick.length} more player${8-S.pick.length===1?'':'s'}.`:S.five.length<5?`Choose ${5-S.five.length} more starter${5-S.five.length===1?'':'s'}.`:!S.five.some(id=>player(id).p.includes('G'))?'Your starting five needs a guard.':!S.five.some(id=>player(id).p.includes('B'))?'Your starting five needs a big.':'Starting five is set. You’re ready to play.';frame(`<div class="kicker">STEP 2 OF 3 • ${programs[S.team??0].n}</div><h2>Build your eight</h2><p class="small">Draft eight players. We’ll suggest a balanced starting five when your roster is full; tap <b>STARTER</b> to change it.</p><div class="grid two"><section class="box"><div class="sectionhead" style="margin-top:0"><h3>Player pool</h3><span class="pill">${S.pick.length}/8 drafted</span></div><div class="cards">${players.map(p=>`<div class="player ${S.pick.includes(p.id)?'on':''}"><div class="playerhead"><span class="emoji">${p.e}</span><div><div class="name">${p.n}</div><div class="role">${p.r} • ${p.p}</div></div></div><div class="statline">SHOOT <b>${p.s}</b> PASS <b>${p.pa}</b> DEF <b>${p.d}</b> IQ <b>${p.q}</b></div>${energyWidget(p.id)}<button class="pbtn" onclick="draft('${p.id}')">${S.pick.includes(p.id)?'REMOVE':'DRAFT'}</button>${S.pick.includes(p.id)?` <button class="pbtn ${S.five.includes(p.id)?'starter':''}" onclick="setStarter('${p.id}')">${S.five.includes(p.id)?'★ STARTER':'SET STARTER'}</button>`:''}</div>`).join('')}</div></section><aside class="box"><div class="kicker">ROSTER CHECK</div><h3>${S.pick.length===8?'Ready to compete':`Choose ${8-S.pick.length} more`}</h3><div class="summary roster-summary"><div class="kpi"><span>Strength</span><b>${S.pick.length===8?rating():'—'}</b></div><div class="kpi"><span>Starters</span><b>${S.five.length}/5</b></div><div class="kpi"><span>Starter energy</span><b>${S.five.length?lineupEnergy()+'%':'—'}</b></div><div class="kpi"><span>Role fit</span><b>${S.pick.length===8?fit():'—'}</b></div><div class="kpi"><span>Bench</span><b>${S.pick.length===8?depth():'—'}</b></div></div><div class="box" style="padding:12px;margin-top:14px"><b>${ready?'✅':'ℹ️'} ${status}</b></div><p class="small" style="margin-top:14px">Balance matters. Build around ball handling, shooting, defense, size, and enough depth to keep legs fresh.</p><div class="box" style="padding:12px;margin-top:12px"><div class="kicker">WEEKEND ${S.week+1}</div><h3>${events[S.week][2]} ${events[S.week][0]}</h3><div class="small">${events[S.week][1]}<br>Three pool games, then the bracket.</div></div><div class="row">${button('Auto-draft balanced','autoDraft()','alt')}</div><div class="row">${button('← Programs','programPick()','ghost')}<button class="btn" onclick="startWeekend()" ${ready?'':'disabled'}>Start tournament →</button></div></aside></div>`)}
function draft(id){if(S.pick.includes(id)){S.pick=S.pick.filter(x=>x!==id);S.five=S.five.filter(x=>x!==id)}else if(S.pick.length<8)S.pick.push(id);if(S.pick.length===8&&S.five.length===0)autoStarters();roster()}
function setStarter(id){if(S.five.includes(id))S.five=S.five.filter(x=>x!==id);else if(S.five.length<5)S.five.push(id);roster()}
function baseStartWeekendImpl(){if(S.team===null||S.pick.length!==8||S.five.length!==5||!S.five.some(id=>player(id).p.includes('G'))||!S.five.some(id=>player(id).p.includes('B')))return;S.poolAt=0;S.pw=0;S.pl=0;S.results=[];S.mode='pool';S.energy={};S.pick.forEach(id=>S.energy[id]=100);weekend()}
function weekend(){S.screen='weekend';const action=S.poolAt<3?`Play Game ${S.poolAt+1} →`:'View pool standings →';frame(`<div class="kicker">${events[S.week][2]} WEEKEND ${S.week+1} • ${events[S.week][0]}</div><h2>${programs[S.team].n} is on the clock</h2><p class="small">Pool play decides who earns a bracket spot. Stay balanced and keep your team fresh.</p><div class="grid two"><section class="box"><div class="kicker">POOL A SCHEDULE</div><h3>${S.pw}–${S.pl} • ${Math.min(S.poolAt+1,3)} of 3</h3><div class="schedule">${opponents.slice(0,3).map((o,i)=>`<div class="match"><span>${i+1}. ${o.e} ${o.n}</span><span class="pill">${S.results[i]||'UP NEXT'}</span></div>`).join('')}</div><div class="sectionhead"><h3>Starting five</h3></div><div class="small">${starters().map(p=>`${p.e} ${p.n}`).join(' • ')}</div><div class="row">${button('← Roster','roster()','alt')}</div></section><section class="box"><div class="kicker">CHOOSE YOUR APPROACH</div><h3>Team tactic</h3><div class="grid two">${tactics.map(t=>`<button class="choice ${S.tactic===t.id?'on':''}" onclick="setTactic('${t.id}')"><b>${t.n}</b><span>${t.d}</span></button>`).join('')}</div><div class="summary"><div class="kpi"><span>Team rating</span><b>${rating()}</b></div><div class="kpi"><span>Role fit</span><b>${fit()}</b></div><div class="kpi"><span>Bench depth</span><b>${depth()}</b></div><div class="kpi"><span>Pool record</span><b>${S.pw}–${S.pl}</b></div></div><div class="row">${button(action,'tipOff()')}</div></section></div>`)}
function setTactic(id){S.tactic=id;weekend()}
function tipOff(){if(S.poolAt>=3){standings();return}S.mode='pool';S.opp=opponents[S.poolAt];beginGame()}
function beginGame(){const delta=rating()-(S.opp.o*.42+S.opp.d*.36+S.opp.q*.22);const gap=Math.round(delta*.3+Math.random()*11-5.5+(typeof matchupEdge==='function'?matchupEdge()*.5:0));S.half={us:34+Math.max(gap,0)+Math.floor(Math.random()*4),them:34+Math.max(-gap,0)+Math.floor(Math.random()*4)};halftime()}
function halftime(){S.screen='half';frame(`<div class="kicker">${S.mode==='pool'?'POOL GAME '+(S.poolAt+1):S.mode==='semi'?'SEMIFINAL':'CHAMPIONSHIP'} • HALFTIME</div><h2>Make the second-half adjustment</h2><div class="grid two"><div class="scoreboard"><div class="scoreline"><b>${programs[S.team].n}</b><span class="score">${S.half.us}</span></div><div class="scoreline"><b>${S.opp.n}</b><span class="score">${S.half.them}</span></div><div class="small">${S.half.us>S.half.them?'You have the lead.':S.half.us<S.half.them?'They have the lead.':'Dead even.'}</div></div><div class="box"><div class="kicker">COACH'S HUDDLE</div><h3>Choose one call</h3><div class="grid"><button class="choice" onclick="finishGame('pressure')"><b>Turn up the pressure</b><span>Try to force a mistake. Can cost energy.</span></button><button class="choice" onclick="finishGame('bench')"><b>Trust the bench</b><span>Fresh legs and defense for the close.</span></button><button class="choice" onclick="finishGame('star')"><b>Play through your floor general</b><span>Put the ball in your best decision-maker's hands.</span></button><button class="choice" onclick="finishGame('calm')"><b>Stay composed</b><span>Protect spacing and avoid a rushed possession.</span></button></div></div></div>`)}
function statAllocation(total,roster,weight){const raw=roster.map(p=>Math.max(.05,weight(p))),sum=raw.reduce((a,b)=>a+b,0),shares=raw.map((w,i)=>({i,n:Math.floor(total*w/sum),fraction:total*w/sum-Math.floor(total*w/sum)}));let left=total-shares.reduce((a,x)=>a+x.n,0);shares.sort((a,b)=>b.fraction-a.fraction);for(let i=0;i<left;i++)shares[i%shares.length].n++;const out=Array(roster.length).fill(0);shares.forEach(x=>out[x.i]=x.n);return out}
function buildBoxScore(us,them){const roster=S.pick.map(id=>player(id)).filter(Boolean);if(!roster.length)return {players:[],totals:{pts:us,reb:0,ast:0,stl:0,blk:0}};const scoreWeights=p=>(S.five.includes(p.id)?1.35:.58)*(p.s*.48+p.pa*.2+p.q*.18+p.a*.14+Math.random()*20);const values={pts:statAllocation(us,roster,scoreWeights),reb:statAllocation(38+Math.floor(Math.random()*10),roster,p=>((p.p.includes('B')?1.5:1)+(p.d+p.a)/200)*(S.five.includes(p.id)?1.1:.62)*(typeof physProfile==='function'?Math.pow(physProfile(p).rebound/64,1.5):1)),ast:statAllocation(12+Math.floor(Math.random()*9),roster,p=>(p.pa*.55+p.q*.45)*(S.five.includes(p.id)?1.2:.7)),stl:statAllocation(5+Math.floor(Math.random()*5),roster,p=>(p.d*.55+p.a*.45)*(S.five.includes(p.id)?1.15:.75)*(typeof physProfile==='function'?physProfile(p).speed/76:1)),blk:statAllocation(2+Math.floor(Math.random()*5),roster,p=>(p.p.includes('B')?2.2:1)*(p.d/75)*(typeof physProfile==='function'?Math.pow(physProfile(p).inches/78,3):1)*(S.five.includes(p.id)?1.15:.7))};const rows=roster.map((p,i)=>({playerId:p.id,name:p.n,position:p.p,pts:values.pts[i],reb:values.reb[i],ast:values.ast[i],stl:values.stl[i],blk:values.blk[i]}));return {players:rows,totals:Object.fromEntries(Object.keys(values).map(k=>[k,values[k].reduce((a,b)=>a+b,0)])),opponentTotals:{pts:them}}}
function recordGameStats(){const boxScore=buildBoxScore(S.game.us,S.game.them),team=programs[S.team]?.n||'Your Program',game={id:`w${S.week+1}-g${S.statLog.length+1}`,week:S.week+1,event:events[S.week]?.[0]||'Season game',stage:S.mode==='pool'?`Pool game ${S.poolAt+1}`:S.mode==='semi'?'Semifinal':'Championship',team,opponent:S.opp?.n||'Opponent',us:S.game.us,them:S.game.them,win:S.game.win,boxScore};S.game.boxScore=boxScore;S.statLog.unshift(game);saveAll()}
function boxTable(box){const rows=box?.players||[];return `<div class="table-wrap"><table class="table box-score-table"><thead><tr><th>Player</th><th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th></tr></thead><tbody>${rows.map(p=>`<tr><td><b>${escapeHtml(p.name)}</b><div class="small">${escapeHtml(p.position)}</div></td><td>${p.pts}</td><td>${p.reb}</td><td>${p.ast}</td><td>${p.stl}</td><td>${p.blk}</td></tr>`).join('')}<tr class="you"><td>TEAM TOTAL</td><td>${box?.totals?.pts||0}</td><td>${box?.totals?.reb||0}</td><td>${box?.totals?.ast||0}</td><td>${box?.totals?.stl||0}</td><td>${box?.totals?.blk||0}</td></tr></tbody></table></div>`}
function seasonStats(){S.screen='stats';const leaders={};S.statLog.forEach(g=>(g.boxScore?.players||[]).forEach(p=>{const x=leaders[p.playerId]||(leaders[p.playerId]={id:p.playerId,name:p.name,position:p.position,gp:0,pts:0,reb:0,ast:0,stl:0,blk:0});x.gp++;['pts','reb','ast','stl','blk'].forEach(k=>x[k]+=Number(p[k]||0))}));const list=Object.values(leaders).sort((a,b)=>b.pts-a.pts),games=S.statLog;frame(`<div class="kicker">AAU DYNASTY • SEASON RECORDS</div><h2>Season stat log</h2><p class="small">${games.length} completed game${games.length===1?'':'s'} · Player totals and per-game averages update after each final.</p><div class="sectionhead"><h2>Player leaders</h2><span class="pill">${list.length} players</span></div>${list.length?`<div class="box table-wrap"><table class="table box-score-table"><thead><tr><th>Player</th><th>GP</th><th>PTS</th><th>PPG</th><th>REB</th><th>RPG</th><th>AST</th><th>APG</th><th>STL</th><th>BLK</th></tr></thead><tbody>${list.map(p=>`<tr><td><b>${escapeHtml(p.name)}</b><div class="small">${escapeHtml(p.position)}</div></td><td>${p.gp}</td><td>${p.pts}</td><td>${(p.pts/p.gp).toFixed(1)}</td><td>${p.reb}</td><td>${(p.reb/p.gp).toFixed(1)}</td><td>${p.ast}</td><td>${(p.ast/p.gp).toFixed(1)}</td><td>${p.stl}</td><td>${p.blk}</td></tr>`).join('')}</tbody></table></div>`:`<div class="box"><h3>No games logged yet</h3><p class="small">Finish your next game and the box score will appear here.</p></div>`}<div class="sectionhead"><h2>Game log</h2><span class="small">Most recent first</span></div>${games.length?games.map(g=>`<details class="box season-log"><summary><b>W${g.week} · ${escapeHtml(g.event)}</b><span>${escapeHtml(g.team)} ${g.us} – ${g.them} ${escapeHtml(g.opponent)} · ${g.win?'W':'L'}</span></summary><div class="small" style="margin:12px 0">${escapeHtml(g.stage)}</div>${boxTable(g.boxScore)}</details>`).join(''):'<div class="box small">Your finished games will be listed here with their full player lines.</div>'}<div class="row">${button('← Back to season','home()','alt')}${S.team!==null&&S.pick.length===8?button('Continue season →','roster()'):''}</div>`)}
function baseFinishGameImpl(call){const delta=rating()-(S.opp.o*.42+S.opp.d*.36+S.opp.q*.22);const boost=call==='pressure'?2:call==='bench'?depth()*.07:call==='star'?avg(starters(),'q')*.055:1;let gap=Math.round(delta*.2+Math.random()*9-4.5+boost+(typeof matchupEdge==='function'?matchupEdge()*.5:0));let us=S.half.us+32+Math.max(gap,0),them=S.half.them+32+Math.max(-gap,0);if(us===them)us++;S.game={us,them,win:us>them,call};recordGameStats();const tax=tactics.find(t=>t.id===S.tactic).tax;S.five.forEach(id=>S.energy[id]=Math.max(50,S.energy[id]-13-tax));S.pick.filter(id=>!S.five.includes(id)).forEach(id=>S.energy[id]=Math.max(55,S.energy[id]-6));if(call==='bench')S.pick.filter(id=>!S.five.includes(id)).forEach(id=>S.energy[id]=Math.min(100,S.energy[id]+5));result()}
function callLabel(c){return({pressure:'Turn up the pressure',bench:'Trust the bench',star:'Play through your floor general',calm:'Stay composed'})[c]}

function advanceGame(){const won=S.game.win;S.wins+=won?1:0;S.losses+=won?0:1;try{localStorage.setItem('aau82save',JSON.stringify({wins:S.wins,losses:S.losses,week:S.week}))}catch(e){}if(S.mode==='pool'){S.results[S.poolAt]=`${S.game.us}–${S.game.them} ${won?'W':'L'}`;if(won)S.pw++;else S.pl++;S.poolAt++;if(S.poolAt>=3)standings();else weekend()}else if(S.mode==='semi'){if(!won)finishWeekend(false);else{S.mode='final';S.opp=opponents[5];bracket()}}else finishWeekend(won)}

function baseNextWeekendImpl(){S.week=Math.min(S.week,5);S.poolAt=0;S.pw=0;S.pl=0;S.results=[];S.pick.forEach(id=>S.energy[id]=Math.min(100,(S.energy[id]||70)+30));weekend()}

const prospects=[
 {id:'zay',n:'Zay Mitchell',r:'Three-Level Scorer',p:'G/W',e:'💥',s:90,pa:82,d:73,q:82,a:89,prospect:true,interestStart:34,pref:'role',prefName:'a clear scoring role'},

 {id:'devin',n:'Devin Cross',r:'Lockdown Wing',p:'W',e:'🔒',s:80,pa:75,d:96,q:85,a:88,prospect:true,interestStart:32,pref:'culture',prefName:'a competitive gym culture'},

function saveAll(){try{localStorage.setItem('aau82director',JSON.stringify(D));localStorage.setItem('aau82save',JSON.stringify({wins:S.wins,losses:S.losses,week:S.week,team:S.team,programSchema:'real-programs-v1',pick:S.pick,five:S.five,tactic:S.tactic,energy:S.energy,statLog:S.statLog}))}catch(e){}}
function player(id){const p=players.find(x=>x.id===id);if(!p)return null;return {...p,...(D.bonuses[id]||{})}}
function rosterPlayers(){return players.filter(p=>!p.prospect||D.signed.includes(p.id))}
function header(){return `<header><div class="brandrow" onclick="home()" style="cursor:pointer"><div class="logo">82</div><div><div class="brand">82<b>–0</b> AAU DYNASTY</div><div class="sub">Build the roster. Chase perfection.</div></div></div><div style="display:flex;gap:7px;align-items:center"><button class="director-link" onclick="directorOffice()">DIRECTOR • ${D.points} PTS</button><div class="record">SEASON <b>${S.wins}–${S.losses}</b></div></div></header>`}
function frame(html){app.innerHTML=header()+`<main>${html}</main><footer>AAU DYNASTY • DIRECTOR MODE</footer>`}
function home(){S.screen='home';frame(`<section class="hero"><div class="kicker">AAU DYNASTY • THE ROAD TO THE PEACH JAM</div><h1>Build a team.<br>Make a run.</h1><p class="lede">Recruit the right talent, build players in-house, and protect your roster when rival programs come calling. Then take your team into tournament weekends and chase a Peach Jam berth.</p><div class="row">${S.team!==null&&S.pick.length===8?button('Continue your season →','roster()'):button('Start your season →','programPick()')}${button('Open the director’s office','directorOffice()','alt')}</div></section><div class="row">${button(`Season stats · ${S.statLog.length} games`,'seasonStats()','alt')}${button(`Daily rewards${rtReadyCount()?' ('+rtReadyCount()+' ready)':''}`,'rewards()','alt')}${button('Weekly leaderboard','leaderboard()','alt')}${button(accountId?'Account':'Save progress','account()','alt')}</div>${legacyProgramSelection?'<div class="box" style="margin-top:12px">Choose your program to continue. Your drafted roster and season record are saved.</div>':''}<div class="sectionhead"><h2>Season map</h2><span class="small">First weekend is ready</span></div>${seasonMap()}<div class="grid three" style="margin-top:13px"><div class="box"><div class="kicker">01 • RECRUIT</div><h3>Find your people</h3><div class="small">Make visits, pitch a role, and sign players who fit your program.</div></div><div class="box"><div class="kicker">02 • DEVELOP</div><h3>Build talent in-house</h3><div class="small">Hire skill trainers and invest in the players already with you.</div></div><div class="box"><div class="kicker">03 • RETAIN</div><h3>Defend your roster</h3><div class="small">Rivals will make offers. Keep your players bought into the program.</div></div></div>`)}
function directorOffice(){S.screen='director';saveAll();const active=rosterPlayers().filter(p=>S.pick.includes(p.id)||D.signed.includes(p.id));const recruitCards=prospects.filter(p=>!D.signed.includes(p.id)).map(p=>{const value=D.interest[p.id]??p.interestStart;return `<article class="director-card"><div class="playerhead"><span class="emoji">${p.e}</span><div><div class="name">${p.n}</div><div class="role">${p.r} • ${p.p}</div></div><span class="tag">${value}% interest</span></div><div class="statgrid"><span>SHOOT<b>${player(p.id).s}</b></span><span>PASS<b>${player(p.id).pa}</b></span><span>DEF<b>${player(p.id).d}</b></span><span>IQ<b>${player(p.id).q}</b></span><span>ATH<b>${player(p.id).a}</b></span></div><div class="interest"><i style="width:${value}%"></i></div><div class="small">Wants ${p.prefName}. Hit 85% to offer a roster spot.</div><div class="grid two" style="margin-top:9px">${[['relationship','Family visit',8],['role','Show a role plan',10],['development','Player growth plan',10],['culture','Bring them to a gym run',9]].map(([type,label,cost])=>`<button class="pbtn" ${D.points<cost||value>=85?'disabled':''} onclick="recruitPitch('${p.id}','${type}',${cost})">${label} • ${cost} pts</button>`).join('')}</div>${value>=85?`<div class="row">${S.pick.length<8?button(`Offer roster spot • 16 pts` ,`completeSigning('${p.id}')`):button('Choose a player to replace ↓','selectReplacement(\''+p.id+'\')','alt')}</div>${D.pendingSign===p.id&&S.pick.length>=8?`<div class="box" style="padding:10px;margin-top:8px"><b>Choose who makes room:</b>${S.pick.map(id=>`<div class="player-mini"><span>${player(id).e} ${player(id).n} • ${Math.round(talent(player(id)))} OVR</span><button class="pbtn" onclick="completeSigning('${p.id}','${id}')">Replace</button></div>`).join('')}</div>`:''}`:''}</article>`}).join('');const trainerCards=trainers.map(t=>`<article class="director-card"><div class="playerhead"><span class="emoji">${t.e}</span><div><div class="name">${t.n}</div><div class="role">${t.role}</div></div></div><p class="small">Each session adds +4 ${t.label.toLowerCase()} and +6 loyalty. Hire cost: <b>${t.cost} points.</b></p>${D.trainers.includes(t.id)?`<span class="tag good">ON STAFF</span>`:`<button class="pbtn" ${D.points<t.cost||D.trainers.length>=2?'disabled':''} onclick="hireTrainer('${t.id}')">Hire trainer • ${t.cost} pts</button>`}</article>`).join('');frame(`<div class="director-title"><div><div class="kicker">COACHING DIRECTOR • PROGRAM BUILD</div><h2>The Director’s Office</h2><p class="small">Earn points on tournament weekends. Choose where your program invests them.</p></div><span class="tag good">${D.points} DIRECTOR POINTS</span></div><div class="summary"><div class="kpi"><span>Recruiting</span><b>${prospects.length-D.signed.length} prospects</b></div><div class="kpi"><span>Training staff</span><b>${D.trainers.length}/2</b></div><div class="kpi"><span>Players under contract</span><b>${D.signed.length}</b></div><div class="kpi"><span>Season record</span><b>${S.wins}–${S.losses}</b></div></div>${D.poach?poachPanel():`<div class="box" style="margin-top:12px"><div class="kicker">ROSTER STATUS</div><h3>Keep the group connected</h3><p class="small">Player loyalty rises when you develop talent and can drop as rival clubs recruit your players. Trainer sessions also build loyalty.</p>${active.length?active.map(p=>`<div class="player-mini"><span>${p.e} ${p.n}</span><span class="tag ${loyalty(p.id)>=75?'good':''}">LOYALTY ${loyalty(p.id)}%</span></div>`).join(''):`<span class="small">Draft a roster to start tracking player relationships.</span>`}</div>`}<div class="sectionhead"><h2>Recruiting board</h2><span class="small">Pitch what each player wants. Sign at 85% interest.</span></div><div class="grid two">${recruitCards||'<div class="box">Your current recruiting class is signed. Rival prospects refresh as the season advances.</div>'}</div><div class="sectionhead"><h2>Skill development staff</h2><span class="small">Hire up to two specialists</span></div><div class="grid two">${trainerCards}</div><div class="sectionhead"><h2>In-house development</h2><span class="small">14 points • +4 skill • +6 loyalty per session</span></div>${D.trainers.length&&active.length?`<div class="grid two">${active.map(p=>`<article class="director-card"><b>${p.e} ${p.n}</b><div class="small">${p.r} • Loyalty ${loyalty(p.id)}%</div><div class="row">${D.trainers.map(id=>{const t=trainers.find(x=>x.id===id);return `<button class="pbtn" ${D.points<14?'disabled':''} onclick="trainingSession('${id}','${p.id}')">${t.label} session • 14 pts</button>`}).join('')}</div></article>`).join('')}</div>`:`<div class="box"><span class="small">Hire a trainer and sign or draft a player to open training sessions.</span></div>`}<div class="row">${button('← Back to season','home()','ghost')}${S.team===null?button('Choose a program →','programPick()'):S.pick.length===8?button('Return to roster →','roster()','alt'):''}</div>`)}
function loyalty(id){if(D.loyalty[id]===undefined)D.loyalty[id]=82;return D.loyalty[id]}
function recruitPitch(id,type,cost){const p=prospects.find(x=>x.id===id);if(!p||D.points<cost||D.signed.includes(id))return;D.points-=cost;const gain=type===p.pref?31:type==='relationship'&&p.pref==='relationship'?31:18;D.interest[id]=Math.min(100,(D.interest[id]??p.interestStart)+gain);saveAll();directorOffice()}
function selectReplacement(id){D.pendingSign=id;directorOffice()}
function completeSigning(id,replaceId){if(D.points<16||D.signed.includes(id)||(D.interest[id]??0)<85)return;if(replaceId&&S.pick.includes(replaceId)){D.points-=16;S.pick=S.pick.map(x=>x===replaceId?id:x);if(S.five.includes(replaceId))S.five=S.five.map(x=>x===replaceId?id:x);D.loyalty[id]=84;D.signed.push(id);D.pendingSign=null;autoStarters()}else if(S.pick.length<8){D.points-=16;D.signed.push(id);D.loyalty[id]=84;if(S.team!==null){S.pick.push(id);if(S.pick.length===8)autoStarters()}}else{D.pendingSign=id;directorOffice();return}saveAll();directorOffice()}
function hireTrainer(id){const t=trainers.find(x=>x.id===id);if(!t||D.trainers.includes(id)||D.trainers.length>=2||D.points<t.cost)return;D.points-=t.cost;D.trainers.push(id);saveAll();directorOffice()}
function trainingSession(trainerId,playerId){const t=trainers.find(x=>x.id===trainerId);if(!t||!D.trainers.includes(trainerId)||D.points<14)return;D.points-=14;D.bonuses[playerId]=D.bonuses[playerId]||{};D.bonuses[playerId][t.stat]=(D.bonuses[playerId][t.stat]||0)+4;D.loyalty[playerId]=Math.min(100,loyalty(playerId)+6);saveAll();directorOffice()}
function poachPanel(){const p=player(D.poach.id);return `<div class="box warning" style="margin-top:12px"><div class="kicker" style="color:var(--gold)">🚨 RIVAL PROGRAM OFFER</div><h3>${p.e} ${p.n} is getting recruited</h3><p class="small">${D.poach.team} is making a push for your player. Make a retention pitch or invest in their future here. Your loyalty score is ${loyalty(p.id)}%.</p><div class="row"><button class="pbtn" ${D.points<15?'disabled':''} onclick="retainPlayer('pitch')">Director-to-player pitch • 15 pts (+20 loyalty)</button><button class="pbtn" ${D.points<22?'disabled':''} onclick="retainPlayer('development')">Guarantee a development plan • 22 pts (+28 loyalty)</button><button class="pbtn" onclick="retainPlayer('release')">Let them explore</button></div></div>`}
function retainPlayer(choice){if(!D.poach)return;const id=D.poach.id;if(choice==='pitch'&&D.points>=15){D.points-=15;D.loyalty[id]=Math.min(100,loyalty(id)+20)}else if(choice==='development'&&D.points>=22){D.points-=22;D.loyalty[id]=Math.min(100,loyalty(id)+28);const p=player(id),stat=p.s<=p.pa&&p.s<=p.d?'s':p.pa<=p.d?'pa':'d';D.bonuses[id]=D.bonuses[id]||{};D.bonuses[id][stat]=(D.bonuses[id][stat]||0)+2}else if(choice==='release'){S.pick=S.pick.filter(x=>x!==id);S.five=S.five.filter(x=>x!==id);D.signed=D.signed.filter(x=>x!==id);D.pendingSign=null}D.poach=null;saveAll();directorOffice()}
function preparePoach(){if(!S.pick.length){D.poach=null;return}const target=[...S.pick].sort((a,b)=>loyalty(a)-loyalty(b))[0];D.poach={id:target,team:['NorCal Voltage','Summit Hoops','Bay City United'][S.week%3]}}
function endScreen(){const doneWeek=Math.max(0,S.week-1);frame(`<section class="hero"><div class="kicker">${S.champ?'TOURNAMENT CHAMPIONS':'WEEKEND COMPLETE'} • ${events[doneWeek][0]}</div><h1>${S.champ?'The trophy is yours.':'The season keeps moving.'}</h1><p class="lede">${programs[S.team].n} finished the weekend. Season record: <b>${S.wins}–${S.losses}</b>. Every tournament is another chance to make progress on The Road to the Peach Jam.</p><div class="row">${button('Run the next weekend →','nextWeekend()')}${button('Director’s office','directorOffice()','alt')}</div></section>${D.poach?poachPanel():''}<div class="sectionhead"><h2>Season map</h2><span class="small">${S.poach?'Answer the rival offer or visit the Director’s Office first.':'Weekend '+Math.min(S.week+1,6)+' is next'}</span></div>${seasonMap()}<div class="summary"><div class="kpi"><span>Pool record</span><b>${S.pw}–${S.pl}</b></div><div class="kpi"><span>Season record</span><b>${S.wins}–${S.losses}</b></div><div class="kpi"><span>Roster rating</span><b>${rating()}</b></div><div class="kpi"><span>Director points</span><b>${D.points}</b></div></div>`)}
const baseFinishGame=baseFinishGameImpl;
function finishGame(call){baseFinishGame(call);D.lastReward=S.game.win?12:8;D.points+=D.lastReward;S.five.forEach(id=>{D.loyalty[id]=Math.max(35,loyalty(id)+(S.game.win?1:-2))});saveAll();result()}
function result(){S.screen='result';const box=S.game.boxScore;frame(`<div class="kicker">${S.mode==='pool'?'POOL PLAY':S.mode==='semi'?'SEMIFINAL':'CHAMPIONSHIP'} • FINAL</div><h2>${S.game.win?'Big win. Keep building.':'Tough result. Respond.'}</h2><div class="scoreboard"><div class="scoreline"><b>${programs[S.team].n}</b><span class="score">${S.game.us}</span></div><div class="scoreline"><b>${S.opp.n}</b><span class="score">${S.game.them}</span></div></div><div class="sectionhead"><h2>Postgame box score</h2><span class="pill">${events[S.week]?.[0]||'Season game'} · ${S.mode==='pool'?`Pool game ${S.poolAt+1}`:S.mode==='semi'?'Semifinal':'Championship'}</span></div><section class="box">${boxTable(box)}<p class="small">Team totals match the final score. Stats are generated by the game simulation.</p></section><div class="grid two" style="margin-top:12px"><div class="box"><div class="kicker">FROM THE SIDELINE</div><div class="log">${S.game.win?'Your team made the right plays when the game tightened up.':'The opponent won the key stretch. Bring the lesson into the next game.'}</div><div class="small">Halftime call: <b>${callLabel(S.game.call)}</b></div><div class="log" style="border-color:var(--lime)">Director reward: <b>+${D.lastReward} points</b> • Balance: <b>${D.points}</b></div></div><div class="box"><div class="kicker">SEASON STATS</div><h3>${S.statLog.length} game${S.statLog.length===1?'':'s'} logged</h3><p class="small">Every player line from this game is saved to your season stat log.</p>${button('View season leaders →','seasonStats()','alt')}</div></div><div class="row">${button('Continue →','advanceGame()')}</div>`)}
const baseFinishWeekend=baseFinishWeekendImpl;
function finishWeekend(champ){baseFinishWeekend(champ);const bonus=champ?28:18;D.points+=bonus;D.lastReward=bonus;preparePoach();saveAll();endScreen()}
const baseNextWeekend=baseNextWeekendImpl;
function nextWeekend(){if(D.poach){directorOffice();return}if(S.pick.length<8){const additions=rosterPlayers().filter(p=>!S.pick.includes(p.id)).sort((a,b)=>talent(b)-talent(a));while(S.pick.length<8&&additions.length)S.pick.push(additions.shift().id);autoStarters()}baseNextWeekend();saveAll()}
function autoDraft(){const sort=[...rosterPlayers()].sort((a,b)=>talent(b)-talent(a));S.pick=sort.slice(0,8).map(p=>p.id);autoStarters();saveAll();roster()}
function chooseTeam(i){S.team=i;legacyProgramSelection=false;saveAll();programPick()}

// Pack rewards and My Collection share one atomic browser save.
const collectionKey='aau82.collection.v1';
const sixAttributes=['Ball Handling','Athleticism','Shooting','Defense','Bag Work','Basketball IQ'];
function cardAttributes(p){return p.catalog?sixAttributes.map(k=>p.catalog.gameRatings[k]):[p.pa,p.a,p.s,p.d,Math.round((p.pa+p.a+p.s)/3),p.q];}
function inventoryRead(){const raw=localStorage.getItem(collectionKey);return raw?JSON.parse(raw):{v:1,packs:1,inventory:{},pulls:[],last:null,matches:0};}
async function inventoryChange(fn){if(!navigator.locks)throw Error('Use a current browser to safely save your collection.');return navigator.locks.request(collectionKey,()=>{const c=inventoryRead(),result=fn(c);localStorage.setItem(collectionKey,JSON.stringify(c));return result;});}
function ownedCardKey(id){return id+':silver-foil:Rare';}
function silverCard(c,showFavorite=true){const p=players.find(p=>p.id===c.playerId),values=c.attributes||cardAttributes(p);return `<article class="silver-card aau-wrap reveal-in">${p.catalog&&typeof aauCard==='function'?aauCard(p,{values}):`<div class="kicker">RARE · SILVER FOIL · SERIES 01</div>${playerPortrait(p)}<h3>${p.n}</h3><div class="small">${escapeHtml(p.r)} • ${p.catalog?escapeHtml(p.catalog.position)+" • CLASS "+p.catalog.classYear:p.p}</div>${p.catalog?rankBadges(p.catalog):""}<div class="six-stats">${sixAttributes.map((label,i)=>`<span>${label}<b>${values[i]}</b></span>`).join('')}</div>`}<div class="small">OWNED ×${c.quantity} · ${Math.max(0,c.quantity-1)} duplicates</div>${p.catalog?`<button class="pbtn" style="margin-top:8px" onclick="playerProfile('${p.id}')">Player info & sources →</button>`:""}${showFavorite?`<button class="btn alt" style="margin-top:12px" aria-pressed="${c.favorite}" onclick="toggleCardFavorite('${ownedCardKey(c.playerId)}')">${c.favorite?'★ Favorited':'☆ Favorite'}</button>`:''}</article>`;}
let favoritesOnly=false,packBusy=false;
function myCollection(){S.screen='collection';const c=inventoryRead(),all=Object.values(c.inventory),shown=all.filter(x=>!favoritesOnly||x.favorite);frame(`<div class="kicker">AAU DYNASTY · PLAYER CARDS</div><h2>My Collection</h2><p class="small">${all.length} unique cards · ${all.reduce((n,x)=>n+x.quantity,0)} total owned. Favorites stay saved when duplicates arrive.</p><div class="row">${button('Rip packs →','packRoom()')}${button(favoritesOnly?'Show all cards':'Favorites only','favoritesOnly=!favoritesOnly;myCollection()','alt')}</div><div class="foil-grid">${shown.map(x=>silverCard(x)).join('')||'<div class="box">'+(favoritesOnly?'No favorites yet. Star a card in your collection.':'Your first pack is waiting. Rip it to start your collection.')+'</div>'}</div><p class="small">Saved in this browser on this device. No cross-device sync yet. Card ratings are prototype ratings; owning cards does not replace recruiting or boost your roster.</p>`);}
async function toggleCardFavorite(key){try{await inventoryChange(c=>{if(c.inventory[key])c.inventory[key].favorite=!c.inventory[key].favorite;});myCollection();}catch(e){alert(e.message);}}
function packRoom(){S.screen='packs';const c=inventoryRead(),last=c.last;frame(`<div class="kicker">AAU DYNASTY · SILVER FOIL SERIES 01</div><h2>Rip into your dynasty</h2><p class="small">${c.packs} packs available · One welcome pack. Earn another every three completed games.</p>${last?`<p role="status">${last.duplicate?'DUPLICATE · OWNED COUNT INCREASED':'NEW PLAYER CARD · ADDED TO MY COLLECTION'}</p><div class="foil-grid">${silverCard(c.inventory[last.cardKey],false)}</div><div class="row">${button('Collect & continue','collectPlayerCard()')}</div>`:`<button class="pack-wrapper" ${c.packs<1||packBusy?'disabled':''} onclick="ripPlayerPack()" aria-label="Open one player card pack">AAU DYNASTY<br>SILVER<br>FOIL</button><p class="small" style="text-align:center">Tap to rip. Every pack contains one complete Rare Silver Foil player card.</p>`}<div class="row">${button('My Collection →','myCollection()','alt')}${button('← Season','home()','ghost')}</div><p class="small">All ${players.length} players have equal pull odds. Duplicate cards increase owned quantity. Pack pulls are saved before the reveal, so reloading never loses a card.</p>`);}
async function ripPlayerPack(){if(packBusy)return;packBusy=true;try{await inventoryChange(c=>{if(c.last)return;if(c.packs<1)throw Error('Play more games to earn a pack.');const roll=new Uint32Array(1);crypto.getRandomValues(roll);const p=players[Math.floor(roll[0]/4294967296*players.length)],key=ownedCardKey(p.id),existing=c.inventory[key],duplicate=!!existing;if(existing)existing.quantity++;else c.inventory[key]={playerId:p.id,edition:'silver-foil',rarity:'Rare',quantity:1,favorite:false,attributes:cardAttributes(p)};c.packs--;const pull={pullId:crypto.randomUUID(),playerId:p.id,edition:'silver-foil',rarity:'Rare',duplicate,cardKey:key};c.pulls.push(pull);c.last=pull;});packRoom();}catch(e){alert(e.message);}finally{packBusy=false;}}
async function collectPlayerCard(){try{await inventoryChange(c=>{c.last=null;});packRoom();}catch(e){alert(e.message);}}

function generatedPlayerAvatar(p){const name=String(p.n||'Player'),seed=[...name].reduce((n,c)=>(n*31+c.charCodeAt(0))>>>0,7),skin=['#f2c6a0','#d99b72','#b87550','#8d543d','#efbd91','#aa6b4d'][seed%6],jersey=['#fb3d4e','#2fb5d8','#8cc63f','#e7a526','#8a68e8','#f16bb2'][seed%6],hair=['#171923','#39251f','#6c482d','#c9b38a','#ece3d0'][Math.floor(seed/7)%5],shirt='#152235';const number=p.catalog?.avatar?.number??(seed%55+1),initials=name.split(' ').filter(x=>x!=='Jr.').map(x=>x[0]).slice(0,2).join('').toUpperCase();return `<div class="generated-player-avatar" role="img" aria-label="Game-generated basketball avatar for ${escapeHtml(name)}"><svg viewBox="0 0 240 300" aria-hidden="true" focusable="false"><defs><linearGradient id="court-${seed}" x2="1" y2="1"><stop stop-color="hsl(${seed%360} 58% 38%)"/><stop offset="1" stop-color="#101a2c"/></linearGradient><linearGradient id="jersey-${seed}" x2="0" y2="1"><stop stop-color="${jersey}"/><stop offset="1" stop-color="${shirt}"/></linearGradient></defs><rect width="240" height="300" fill="url(#court-${seed})"/><circle cx="190" cy="42" r="52" fill="#ffffff" opacity=".08"/><path d="M25 300c4-62 35-96 95-96s91 34 95 96" fill="url(#jersey-${seed})"/><path d="M81 208h78l17 37-56 27-56-27z" fill="${skin}"/><ellipse cx="120" cy="131" rx="57" ry="70" fill="${skin}"/><path d="M63 129c-8-49 10-83 57-83 45 0 65 32 57 79-15-11-26-27-32-46-23 24-51 37-82 40z" fill="${hair}"/><path d="M83 130q12-9 23 0M134 130q12-9 23 0" fill="none" stroke="#30241f" stroke-width="5" stroke-linecap="round"/><ellipse cx="96" cy="145" rx="4" ry="6" fill="#17202b"/><ellipse cx="144" cy="145" rx="4" ry="6" fill="#17202b"/><path d="M111 163q9 7 18 0" fill="none" stroke="#854f42" stroke-width="4" stroke-linecap="round"/><path d="M74 235l46 24 46-24" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="4"/><text x="120" y="283" text-anchor="middle" font-size="25" font-weight="900" fill="#fff">${escapeHtml(String(number))}</text></svg><span class="generated-avatar-initials" aria-hidden="true">${escapeHtml(initials)}</span></div>`;}
function playerPortrait(p,eager=false){const c=p.catalog,initials=p.n.split(' ').filter(x=>x!=='Jr.').map(x=>x[0]).slice(0,2).join('');if(c?.originalSeries==='circuit-originals-v1'&&c.artPanel){const panel=Number(c.artPanel),col=(panel-1)%4,row=Math.floor((panel-1)/4),x=col/3*100,y=row*100;return `<div class="circuit-portrait" role="img" aria-label="Original Circuit Originals card art for ${escapeHtml(p.n)}" style="--art-x:${x}%;--art-y:${y}%"></div>`}if(c?.photo?.status==='verified')return `<div class="player-photo-frame">${generatedPlayerAvatar(p)}<img class="player-photo" loading="${eager?'eager':'lazy'}" decoding="async" fetchpriority="${eager?'high':'auto'}" width="${c.photo.width||315}" height="${c.photo.height||420}" src="${escapeHtml(c.photo.optimizedUrl||c.photo.localUrl)}" alt="${escapeHtml(p.n)}" onload="this.previousElementSibling.style.visibility='hidden'" onerror="this.remove()"></div>`;return generatedPlayerAvatar(p);}

function playerDeck(){S.screen='deck';profileReturn='deck';if(!catalogData){frame(`<h2>Player Database</h2><div class="box">${catalogError||'Loading recruiting catalog…'}</div><div class="row">${button('Retry','bootCatalog()','alt')}${button('← Season','home()','ghost')}</div>`);return;}const deck=players.filter(p=>p.catalog);let pool=deck.filter(p=>{const c=p.catalog;return (catalogSource==='All'||c.coverage.includes(catalogSource))&&(catalogPosition==='All'||c.position===catalogPosition)&&(!catalogSearch||[p.n,c.school,c.hometown,c.archetype].join(' ').toLowerCase().includes(catalogSearch.toLowerCase()));});pool.sort((a,b)=>{const rank=p=>{const rs=(p.catalog.rankings||[]).filter(r=>catalogSource==='All'||r.source===catalogSource).map(r=>r.rank).filter(Number.isFinite);return rs.length?Math.min(...rs):10000};return rank(a)-rank(b)||a.n.localeCompare(b.n);});const real=deck.filter(p=>!p.catalog.isFictional),fiction=deck.filter(p=>p.catalog.isFictional),totalPages=Math.max(1,Math.ceil(pool.length/24));catalogPage=Math.min(catalogPage,totalPages-1);const shown=pool.slice(catalogPage*24,catalogPage*24+24);frame(`<div class="kicker">Peach Jam · PLAYER DATABASE · CLASS 2027</div><div class="catalog-top"><h2>The Player Deck</h2>${button('Rip a pack →','packRoom()')}</div><p class="small">Published recruiting profiles and clearly marked fictional game players share the Silver Foil card format.</p><div class="catalog-stats"><span><b>${real.length}</b> real prospects</span><span><b>${fiction.length}</b> fictional players</span><span><b>${real.filter(p=>p.catalog.photo?.status==='verified').length}</b> verified player photos</span><span>Rankings snapshot <b>Oct 10, 2026</b></span></div><div class="catalog-controls"><input id="catalogSearch" aria-label="Search players, schools or hometowns" value="${escapeHtml(catalogSearch)}" placeholder="Search player, school, hometown, archetype…" oninput="catalogSearch=this.value;catalogPage=0;renderDeckResults()"><select aria-label="Player type or rankings source" onchange="catalogSource=this.value;catalogPage=0;playerDeck()">${['All','Dynasty Scouts'].map(x=>`<option ${catalogSource===x?'selected':''}>${x}</option>`).join('')}</select><select aria-label="Position" onchange="catalogPosition=this.value;catalogPage=0;playerDeck()">${['All','PG','SG','CG','SF','PF','C'].map(x=>`<option ${catalogPosition===x?'selected':''}>${x}</option>`).join('')}</select></div><div id="deckResults"><p class="small">${pool.length} matching players · Page ${catalogPage+1} of ${totalPages}${catalogSource==='Fictional'?' · fictional showcase':''}</p><div class="foil-grid">${shown.map(catalogCard).join('')||'<div class="box catalog-empty">No matching players.</div>'}</div><div class="row">${catalogPage?button('← Previous','catalogPage--;playerDeck()','alt'):''}${catalogPage+1<totalPages?button('Next →','catalogPage++;playerDeck()','alt'):''}</div></div><div class="box" style="margin-top:22px"><p class="small">All players are fictional and generated for AAU Dynasty. Ranks and stars come from the in-game Dynasty Scouts. Owning a card does not sign that player to your AAU team.</p></div><div class="row">${button('My Collection','myCollection()','alt')}${button('Director’s office','directorOffice()','alt')}${button('← Season','home()','ghost')}</div>`)}

const missionPackRoomBase=packRoom;

const missionTrainingBase=trainingSession;
trainingSession=function(trainerId,playerId){const before=D.points;missionTrainingBase(trainerId,playerId);if(D.points<before){D.trainingSessions=(D.trainingSessions||0)+1;saveAll()}};
