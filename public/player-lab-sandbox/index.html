<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AAU Dynasty · Player Lab</title><style>body{margin:0;background:#07111d;color:#eef4ff;font:15px system-ui,sans-serif}header{padding:18px 24px;display:flex;justify-content:space-between;align-items:center;background:#101d2d}h1{margin:0;font-size:22px}.sub{color:#9fb3ca;margin:4px 0 0}.tools{display:flex;gap:8px;flex-wrap:wrap;padding:14px 24px;background:#0b1726}button{border:1px solid #46617c;border-radius:8px;background:#182a3d;color:#eef4ff;padding:9px 13px;cursor:pointer}button.active{background:#e6b85c;color:#111;border-color:#e6b85c}main{max-width:1280px;margin:auto}canvas{display:block;width:100%;height:auto;max-height:calc(100vh - 150px);object-fit:contain;background:#0b1320}</style></head><body><main><header><div><h1>PLAYER LAB</h1><p class="sub">One player · empty gym · animation sandbox</p></div><a href="/" style="color:#f2c76d">Back to game</a></header><div class="tools"><button data-mode="idle" class="active">Idle</button><button data-mode="jog">Jog</button><button data-mode="defend">Defensive stance</button><button data-mode="gather">Gather</button><button data-mode="shot">Jump shot</button><button id="names">Name tag: on</button></div><canvas id="lab" width="1280" height="720" aria-label="Single player animation sandbox"></canvas></main><script src="/chibi-v0.6/three.min.js"></script><script src="/chibi-v0.6/index.html" type="application/none"></script><script>

</script><script src="/chibi-v0.6/renderer.js"></script><script>
const canvas=document.querySelector('#lab'), view=new ChibiCourt(canvas); view.view=4; view.playerLab=true; view.labCamera={yaw:-.7,pitch:.18,distance:3.8}; const actor={id:'lab-player',name:'Player Lab',team:0,position:'G',skin:'#8d5a3c',hair:4,number:1,at:{x:650,y:340},velocity:{x:0,y:0},gait:0}; view.spotlightActor=actor; let dragging=false,lastX=0,lastY=0; canvas.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!dragging)return;view.labCamera.yaw+=(e.clientX-lastX)*.01;view.labCamera.pitch=Math.max(-.55,Math.min(.7,view.labCamera.pitch+(e.clientY-lastY)*.008));lastX=e.clientX;lastY=e.clientY;view.setCamera()});canvas.addEventListener('pointerup',()=>dragging=false);canvas.addEventListener('wheel',e=>{view.labCamera.distance=Math.max(2.4,Math.min(6,view.labCamera.distance+e.deltaY*.005));view.setCamera()},{passive:true});
let mode='idle',names=true,elapsed=0,last=performance.now(),keys={}; const m={actors:[actor],off:[actor],holder:0,side:0,shot:null,ball:{x:650,y:340},height:0,phase:'live',stageTime:0,elapsed:0,done:false,reboundWinner:null};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));}); document.querySelector('#names').onclick=e=>{names=!names;e.currentTarget.textContent='Name tag: '+(names?'on':'off');};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.startsWith('Arrow')||e.key===' ')e.preventDefault()});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;elapsed+=dt; m.elapsed=elapsed; const dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),moving=dx||dy;if(moving&&mode==='idle')mode='jog';actor.at.x=Math.max(440,Math.min(860,actor.at.x+dx*125*dt));actor.at.y=Math.max(220,Math.min(460,actor.at.y+dy*125*dt));actor.velocity.x=dx*125;actor.velocity.y=dy*125;actor.gait+=dt*(moving?8:mode==='defend'?3:1);m.ball.x=actor.at.x;m.ball.y=actor.at.y;m.phase=mode==='gather'?'gather':mode==='shot'?'shot':'done';m.stageTime=elapsed%1.2;m.height=mode==='shot'?Math.sin(Math.min(1,m.stageTime/.7)*Math.PI)*30:0;view.render(m,{names});requestAnimationFrame(loop)} requestAnimationFrame(loop);
